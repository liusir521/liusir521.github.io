    <rect x="21" y="55" width="94" height="49" rx="9" fill="#2852a0"/>
    <rect x="135" y="55" width="94" height="49" rx="9" fill="#2852a0"/>
    <circle cx="44" cy="75" r="7" fill="#a8ddff"/><circle cx="158" cy="75" r="7" fill="#a8ddff"/>
    <text x="56" y="81" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Pod</text>
    <text x="170" y="81" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Pod</text>
  </g>

  <g transform="translate(1058 477)">
    <rect width="250" height="133" rx="16" fill="#132746" stroke="#3e83e8" stroke-width="2"/>
    <text x="21" y="34" fill="#79bdff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" letter-spacing="2">WORKER NODE 02</text>
    <rect x="21" y="55" width="94" height="49" rx="9" fill="#2852a0"/>
    <rect x="135" y="55" width="94" height="49" rx="9" fill="#2852a0"/>
    <circle cx="44" cy="75" r="7" fill="#a8ddff"/><circle cx="158" cy="75" r="7" fill="#a8ddff"/>
    <text x="56" y="81" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Pod</text>
    <text x="170" y="81" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Pod</text>
  </g>

  <g transform="translate(91 711)">
    <circle cx="8" cy="0" r="6" fill="#53b6ff"/>
    <text x="26" y="7" fill="#8ea8cf" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17">期望状态 → 控制平面 → 节点 → Pod</text>
